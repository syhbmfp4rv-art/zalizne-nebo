<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=26" />
</head>
<body>
  <div id="map" aria-label="Інтерактивна тактична карта світу"></div>

  <div class="radar-grid"></div>
  <div class="radar-sweep"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="timer-panel" aria-label="Актуальное время Украины">
    <span class="timer-label">ЧАС УКРАЇНИ</span>
    <strong id="countdown">00:00:00</strong>
    <span class="timer-state" id="timerState">--.--.----</span>
    <span class="iron-dome-title">ЗАЛІЗНЕ НЕБО</span>
  </div>

  <header class="hud-top">
    <div class="system-name">
      <span class="system-dot"></span>
    </div>
    <div class="live-status"><span></span> LIVE</div>
    <div id="threatCount" class="threat-count">ЦІЛІ: 0</div>
  </header>

  <div class="reticle" aria-hidden="true">
    <span class="reticle-h"></span>
    <span class="reticle-v"></span>
    <span class="reticle-ring ring-a"></span>
    <span class="reticle-ring ring-b"></span>
    <span class="reticle-ring ring-c"></span>
  </div>

  <div class="controls-panel">
    <button id="homeBtn" class="radar-btn">⌖ ЦЕНТР: УКРАЇНА</button>
    <button id="styleBtn" class="radar-btn compact" title="Сменить режим радара">MODE</button>
  </div>

  <div class="coordinates" id="coords">31.2056 E / 48.3794 N</div>


  <aside class="telegram-feed" id="telegramFeed" aria-label="Новини Telegram каналу Zalizne Nebo">
    <div class="telegram-feed__header">
      <div>
        <span class="telegram-feed__eyebrow">TELEGRAM / LIVE</span>
        <a href="https://t.me/zalizne_nebo" target="_blank" rel="noopener noreferrer">@zalizne_nebo</a>
      </div>
      <button class="telegram-feed__toggle" id="telegramFeedToggle" type="button" aria-label="Згорнути новини">×</button>
    </div>
    <div class="telegram-feed__status" id="telegramFeedStatus">ЗАВАНТАЖЕННЯ НОВИН...</div>
    <div class="telegram-feed__list" id="telegramFeedList"></div>
    <a class="telegram-feed__open" href="https://t.me/zalizne_nebo" target="_blank" rel="noopener noreferrer">ВІДКРИТИ КАНАЛ →</a>
  </aside>
  <button class="telegram-feed-tab" id="telegramFeedTab" type="button" aria-label="Відкрити новини Telegram">НОВИНИ</button>

  <div class="data-attribution">ДАНІ ТРИВОГ: <a href="https://neptun.in.ua/" target="_blank" rel="noopener noreferrer">NEPTUN</a></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://neptun.in.ua/sdk/neptun.js"></script>
  <script src="app.js?v=26"></script>

<div id="radarOverlay"><div class="rings"></div><div class="sweep"></div><div class="cross"></div></div>
<style>
#radarOverlay{
  pointer-events:none;
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:896px;
  height:896px;
  border-radius:50%;
  z-index:9999;
  opacity:.56;
  overflow:hidden;
  border:1px solid rgba(148,181,96,.48);
  background:
    radial-gradient(circle at center, rgba(70,96,45,.10) 0%, rgba(39,57,29,.08) 52%, rgba(17,29,15,.20) 100%),
    repeating-radial-gradient(circle at center, transparent 0 7px, rgba(150,176,102,.025) 8px 9px);
  box-shadow:
    0 0 18px rgba(96,126,63,.24),
    inset 0 0 24px rgba(117,150,76,.12);
}
#radarOverlay::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:50%;
  opacity:.20;
  background-image:
    repeating-linear-gradient(0deg, rgba(203,221,157,.26) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(96,122,72,.10) 0 1px, transparent 1px 7px);
  mix-blend-mode:screen;
}
#radarOverlay .rings{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle, transparent 19%, rgba(156,184,103,.66) 20%, transparent 20.7%,
    transparent 39%, rgba(145,172,92,.56) 40%, transparent 40.7%,
    transparent 59%, rgba(134,161,83,.48) 60%, transparent 60.7%,
    transparent 79%, rgba(122,149,76,.40) 80%, transparent 80.7%);
  filter:drop-shadow(0 0 3px rgba(139,171,91,.42));
}
#radarOverlay .cross:before,#radarOverlay .cross:after{
  content:'';
  position:absolute;
  background:rgba(151,179,98,.48);
  box-shadow:0 0 4px rgba(126,158,80,.26);
}
#radarOverlay .cross:before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%)}
#radarOverlay .cross:after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%)}
#radarOverlay .sweep{
  position:absolute;
  inset:-2px;
  border-radius:50%;
  background:conic-gradient(
    from 0deg,
    rgba(117,151,75,0) 0deg,
    rgba(117,151,75,.04) 282deg,
    rgba(137,171,87,.13) 318deg,
    rgba(164,194,104,.34) 346deg,
    rgba(191,215,128,.68) 358deg,
    rgba(117,151,75,0) 360deg
  );
  animation:radarspin 6.8s linear infinite;
  filter:blur(.54px) drop-shadow(0 0 7px rgba(148,182,94,.38));
  mix-blend-mode:screen;
}
@keyframes radarspin{to{transform:rotate(360deg)}}
</style>
</body>
</html>
